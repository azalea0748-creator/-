<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>新規振り返り</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f5f4;color:#1e293b;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 60px}
  h1{font-size:20px;margin:0 0 2px}.sub{font-size:12px;color:#64748b}
  .today{margin-top:10px;background:#0f172a;color:#fff;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;font-size:13px}
  .today b{font-size:18px}
  label{display:block;font-size:12px;font-weight:700;color:#334155;margin:15px 0 5px}
  .qhint{font-size:11px;color:#94a3b8;font-weight:400;margin-left:4px}
  input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff}
  textarea{min-height:58px;resize:vertical}
  .seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
  .seg.two{grid-template-columns:1fr 1fr}
  .seg.reason{grid-template-columns:1fr 1fr}
  .seg.stores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .seg.stores button{padding:11px 4px;white-space:nowrap;font-size:12px}
  .seg button{padding:11px 6px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .seg.reason button{text-align:left}
  .geo-label{font-size:11px;font-weight:700;color:#b45309;margin:12px 0 5px;padding-top:10px;border-top:1px dashed #d6d3d1}
  .seg.reason.geo button{border-color:#fcd34d;color:#b45309;background:#fffbeb}
  .seg.reason.geo button.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
  .seg.reason button[data-v="次回入会予定"]{color:#0d9488;border-color:#99f6e4}
  .seg.reason button[data-v="次回入会予定"].on{background:#0d9488;color:#fff;border-color:#0d9488}
  .seg button.on{background:#0f172a;color:#fff;border-color:#0f172a}
  .multi button.on{background:#0d9488;border-color:#0d9488;color:#fff}
  .req{color:#e11d48}.memo{font-size:11px;color:#0d9488;margin-left:6px;font-weight:700}
  .check{border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
  .check .q{font-size:13px;font-weight:700;margin-bottom:2px}
  .check .d{font-size:11px;color:#64748b;margin-bottom:7px}
  .yn{display:flex;gap:6px}.yn button{flex:1;padding:9px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
  .yn button.ok{background:#0d9488;color:#fff;border-color:#0d9488}.yn button.ng{background:#e11d48;color:#fff;border-color:#e11d48}
  .send{margin-top:22px;width:100%;padding:15px;background:#0d9488;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}
  .out{margin-top:18px;background:#0f172a;border-radius:12px;padding:16px;color:#fff;display:none}.out.show{display:block}
  .out pre{white-space:pre-wrap;font-size:13px;line-height:1.6;margin:0 0 12px;font-family:inherit}
  .copy{width:100%;padding:13px;background:#5eead4;color:#0f172a;border:none;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer}
  .status{font-size:12px;margin-top:8px;text-align:center;color:#5eead4}
  .again{width:100%;padding:11px;margin-top:8px;background:transparent;color:#94a3b8;border:1px solid #334155;border-radius:8px;font-size:13px;cursor:pointer}
  .onlyIn,.onlyLost{display:none}.onlyIn.show,.onlyLost.show{display:block}
</style>
<div class="wrap">
  <h1>新規振り返り</h1>
  <div class="sub">1件ごとに入力 → 送信 → コピーしてLINEワークスに貼る</div>
  <div class="today"><span>今月の実績</span><span>入会 <b id="t-w">0</b> ・ 母数 <b id="t-n">0</b> ・ 入会率 <b id="t-r">0%</b></span></div>

  <label>日付 <span class="req">*</span></label>
  <input type="date" id="date" />
  <label>エリア <span class="req">*</span><span class="memo" id="m-area"></span></label>
  <div class="seg two" id="area"></div>
  <label>店舗 <span class="req">*</span><span class="memo" id="m-store"></span></label>
  <div class="seg stores" id="store"></div>
  <label>担当（氏名） <span class="req">*</span><span class="memo" id="m-staff"></span></label>
  <input id="staff" />
  <label>性別</label>
  <div class="seg two" id="sex"></div>

  <label>来店きっかけ <span class="qhint">広告 / 紹介 / 通りがかり など</span></label>
  <input id="kikkake" />
  <label>主訴・来店目的（困りごと） <span class="req">*</span></label>
  <div class="seg multi" id="parts"></div>
  <input id="shusho_free" placeholder="補足（例：ゴルフのパフォーマンスアップ）" style="margin-top:6px" />
  <label>理想状態 <span class="qhint">いつまでに・どうなりたいか</span></label>
  <textarea id="ideal"></textarea>

  <label>結果 <span class="req">*</span></label>
  <div class="seg two" id="result"></div>

  <div class="onlyIn" id="inBlock">
    <label>入会理由 <span class="qhint">決め手になったのは何か</span></label>
    <textarea id="in_reason"></textarea>
  </div>
  <div class="onlyLost" id="lostBlock">
    <label>非入会理由 <span class="qhint">なぜ登録しなかったか（断り文句でOK・複数可）</span></label>
    <div class="seg reason multi" id="reason"></div>
    <div class="geo-label">通えない事情（分類が別）</div>
    <div class="seg reason multi geo" id="reason_geo"></div>
    <input id="reason_free" placeholder="その他・具体的にあれば" style="margin-top:6px" />
  </div>

  <label>今日できたことチェック</label>
  <div id="checks"></div>

  <label>振り返り <span class="qhint">今日の接客で気づいたこと</span></label>
  <textarea id="reflection"></textarea>
  <label>次回APで意識すること <span class="qhint">次の新規接客で実践する行動を1つに絞る</span></label>
  <textarea id="ap"></textarea>

  <button class="send" id="send">送信してテキストを作る</button>
  <div class="out" id="out">
    <pre id="text"></pre>
    <button class="copy" id="copy">この内容をコピー</button>
    <div class="status" id="status"></div>
    <button class="again" id="again">続けてもう1件入力</button>
  </div>
</div>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbymLb-U79cBpBA8az64TzN3G6H0dLhLOpOiMmg229O_nXEKFsO2b896Pli7AU37r8NU/exec";
const AREAS={"兵庫":["神戸北","三宮","トアロード","元町","デュオ","加古川","姫路"],"中国":["イオン岡山","倉敷天満屋","本通","ゆめタウン"]};
const REASONS=["高い・予算が","今じゃなくていい","家族と相談","通う時間がない","効果が続くか不安","縛り・解約が不安","都度でいい","必要性を感じてない","次回入会予定","クレジット未所持"];
const GEO_REASONS=["片道1時間以上の遠方","30分圏内に店舗なし"];
const CHECKS=[["ヒアリング","困りごとや理想を正しく把握できたか"],["体感","お客様が驚く変化があったか"],
  ["周期啓蒙","理想の周期(週1)を根拠をもとに説明できたか"],["習慣化啓蒙","今から健康習慣を作る重要性を説明できたか"],
  ["クロージング","継続への不安を解消し、背中を押す言い切りの提案ができたか"]];
const LS=window.localStorage,$=id=>document.getElementById(id);
function seg(id,opts,multi,cb){const el=$(id);el.innerHTML=opts.map(o=>`<button type="button" data-v="${o}">${o}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(multi){b.classList.toggle("on");el.dataset.val=[...el.querySelectorAll("button.on")].map(x=>x.dataset.v).join("・");}
    else{el.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");el.dataset.val=b.dataset.v;}
    if(cb)cb(el.dataset.val);});}
seg("area",Object.keys(AREAS),false,a=>{seg("store",AREAS[a],false,()=>LS.setItem("f_store",$("store").dataset.val));$("store").dataset.val="";$("m-store").textContent="";LS.setItem("f_area",a);});
seg("sex",["男性","女性"],false);
seg("parts",["肩","首","腰","背","臀部","足","その他"],true);
seg("result",["入会","非入会"],false,r=>{$("inBlock").classList.toggle("show",r==="入会");$("lostBlock").classList.toggle("show",r==="非入会");});
seg("reason",REASONS,true);
seg("reason_geo",GEO_REASONS,true);
$("checks").innerHTML=CHECKS.map((c,i)=>`<div class="check"><div class="q">${c[0]}</div><div class="d">${c[1]}</div>
  <div class="yn" id="chk${i}"><button type="button" data-v="できた">できた</button><button type="button" data-v="できなかった">できなかった</button></div></div>`).join("");
CHECKS.forEach((c,i)=>{const el=$("chk"+i);el.querySelectorAll("button").forEach(b=>b.onclick=()=>{el.querySelectorAll("button").forEach(x=>{x.classList.remove("ok","ng")});b.classList.add(b.dataset.v==="できた"?"ok":"ng");el.dataset.val=b.dataset.v;});});
$("date").valueAsDate=new Date();
// 記憶：エリア・店舗のみ（担当は記憶しない）
(function(){const a=LS.getItem("f_area");if(a&&AREAS[a]){[...$("area").querySelectorAll("button")].find(b=>b.dataset.v===a).click();$("m-area").textContent="前回を記憶";
  const s=LS.getItem("f_store");if(s){const bt=[...$("store").querySelectorAll("button")].find(b=>b.dataset.v===s);if(bt){bt.click();$("m-store").textContent="前回を記憶";}}}
  const st=LS.getItem("f_staff");if(st){$("staff").value=st;$("m-staff").textContent="前回を記憶";}})();
$("staff").onchange=()=>LS.setItem("f_staff",$("staff").value);
function dayKey(){return "cnt_"+$("date").value;}
function monthPrefix(){return "cnt_"+($("date").value||"").slice(0,7);} // cnt_YYYY-MM
function renderMonth(){let n=0,w=0;const pre=monthPrefix();for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.indexOf(pre)===0){try{const c=JSON.parse(LS.getItem(k));n+=c.n||0;w+=c.w||0;}catch(e){}}}$("t-n").textContent=n;$("t-w").textContent=w;$("t-r").textContent=(n?Math.round(w/n*100):0)+"%";}
$("date").onchange=renderMonth;renderMonth();
const val=id=>$(id).dataset.val||"";
function build(){
  const d=$("date").value,sh=[val("parts"),$("shusho_free").value.trim()].filter(Boolean).join("・");
  const L=[];
  L.push(`【新規振り返り】${d}`);
  L.push(`${val("area")}／${val("store")}／${$("staff").value}`);
  // 基本情報を1行に圧縮
  const meta=[`結果：${val("result")}`];
  if(val("sex"))meta.push(val("sex"));
  if($("kikkake").value.trim())meta.push(`きっかけ：${$("kikkake").value.trim()}`);
  L.push(meta.join(" ・ "));
  L.push("");
  L.push(`主訴：${sh}`);
  if($("ideal").value.trim())L.push(`理想：${$("ideal").value.trim()}`);
  if(val("result")==="入会"&&$("in_reason").value.trim()){L.push("");L.push(`入会理由：${$("in_reason").value.trim()}`);}
  if(val("result")==="非入会"){const rs=[val("reason"),val("reason_geo"),$("reason_free").value.trim()].filter(Boolean).join("・");if(rs){L.push("");L.push(`非入会理由：${rs}`);}}
  const chk=CHECKS.map((c,i)=>val("chk"+i)?`${val("chk"+i)==="できた"?"○":"×"} ${c[0]}`:null).filter(Boolean);
  if(chk.length){L.push("");L.push("【できたこと】");chk.forEach(x=>L.push(x));}
  if($("reflection").value.trim()){L.push("");L.push(`振り返り：${$("reflection").value.trim()}`);}
  if($("ap").value.trim()){L.push("");L.push(`次回APで意識すること：${$("ap").value.trim()}`);}
  return L.join("\n");
}
$("send").onclick=()=>{
  if(!$("date").value||!val("area")||!val("store")||!$("staff").value||!val("result")||!val("parts")){
    alert("日付・エリア・店舗・担当・結果・主訴は必須です");return;}
  const text=build();$("text").textContent=text;$("out").classList.add("show");$("out").scrollIntoView({behavior:"smooth"});
  const c=JSON.parse(LS.getItem(dayKey())||'{"n":0,"w":0}');c.n++;if(val("result")==="入会")c.w++;LS.setItem(dayKey(),JSON.stringify(c));renderMonth();
  if(GAS_URL){const p={date:$("date").value,area:val("area"),store:val("store"),staff:$("staff").value,sex:val("sex"),
    kikkake:$("kikkake").value,shusho:[val("parts"),$("shusho_free").value].filter(Boolean).join("／"),ideal:$("ideal").value,reflection:$("reflection").value,result:val("result"),
    in_reason:$("in_reason").value,reason:[val("reason"),val("reason_geo"),$("reason_free").value].filter(Boolean).join("・"),
    checks:CHECKS.map((c,i)=>c[0]+":"+(val("chk"+i)||"")).join(" / "),ap:$("ap").value,text};
    fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).then(()=>$("status").textContent="✓ 記録OK").catch(()=>{});}
};
$("copy").onclick=()=>{navigator.clipboard.writeText($("text").textContent)
  .then(()=>$("status").textContent="✓ コピーしました。LINEワークスに貼ってください")
  .catch(()=>{const r=document.createRange();r.selectNode($("text"));getSelection().removeAllRanges();getSelection().addRange(r);document.execCommand("copy");$("status").textContent="✓ コピーしました";});};
$("again").onclick=()=>{["kikkake","shusho_free","ideal","reflection","in_reason","reason_free","ap"].forEach(id=>$(id).value="");
  ["sex","parts","result","reason","reason_geo"].forEach(id=>{const el=$(id);el.dataset.val="";el.querySelectorAll("button").forEach(x=>x.classList.remove("on"));});
  CHECKS.forEach((c,i)=>{const el=$("chk"+i);el.dataset.val="";el.querySelectorAll("button").forEach(x=>x.classList.remove("ok","ng"));});
  $("inBlock").classList.remove("show");$("lostBlock").classList.remove("show");$("out").classList.remove("show");window.scrollTo({top:0,behavior:"smooth"});};
</script>
