<!DOCTYPE html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>週次スタッフ ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--base:#f6f4ef;--ink:#1a1a1a;--accent:#d80c24;--line:#e3ddd2;--card:#fffdf9;--muted:#8a8378}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:22px 16px 70px}
.head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:12px;flex-wrap:wrap;gap:10px}
.head h1{font-family:"Anton",sans-serif;font-size:32px;font-weight:400;letter-spacing:.02em;margin:0;line-height:1}
.head h1 .en{display:block;font-size:11px;letter-spacing:.25em;color:var(--muted);font-family:"Zen Kaku Gothic New";font-weight:700;margin-bottom:4px}
.head .date{font-size:12px;color:var(--muted);font-weight:700}
.samplebar{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;padding:9px 13px;border-radius:10px;margin-top:14px;font-weight:700;display:none}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.ctrl{gap:10px}.ctrl select{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;font-family:inherit;color:var(--ink);cursor:pointer;min-width:130px}
.wk{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.wk button{border:2px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:12px;padding:8px 13px;border-radius:10px;cursor:pointer;font-family:inherit}
.wk button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.section-label{font-family:"Anton",sans-serif;font-size:15px;letter-spacing:.08em;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.section-label::before{content:"";width:5px;height:20px;background:var(--accent);display:inline-block;border-radius:2px}
.count{font-family:"Anton";background:var(--accent);color:#fff;border-radius:20px;padding:1px 11px;font-size:14px}
.count.zero{background:#16a34a}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acard{border-radius:14px;padding:16px 18px;border:2px solid;position:relative;overflow:hidden}
.acard.red{background:#fff5f5;border-color:#f3b8b8}
.acard.red::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.acard.ok{background:#f0fdf4;border-color:#bbf7d0}
.acard .who{font-family:"Anton",sans-serif;font-size:22px;letter-spacing:.02em}
.acard .why{font-size:13px;margin-top:5px;font-weight:900;color:var(--accent)}
.acard .det{font-size:11px;color:var(--muted);margin-top:4px;font-weight:700}
.acard.ok .who{color:#15803d}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.panel h3{font-family:"Anton";font-size:17px;letter-spacing:.05em;margin:0 0 3px;font-weight:400}
.panel .note{font-size:11px;color:var(--muted);margin:0 0 14px;font-weight:700}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{font-family:"Anton";font-weight:400;letter-spacing:.05em;font-size:12px;color:var(--muted);text-align:center;padding:6px 8px;border-bottom:2px solid var(--line)}
thead th:first-child{text-align:left}
tbody td{padding:11px 8px;text-align:center;border-bottom:1px solid var(--line)}
tbody td.nm{text-align:left;font-weight:900;font-size:15px;white-space:nowrap}
tbody tr.danger{background:#fff5f5}
.num{font-family:"Anton";font-size:20px;font-weight:400}
.rate{font-family:"Anton";font-size:20px;padding:3px 12px;border-radius:8px;display:inline-block;min-width:64px}
.r-bad{background:#fde2e2;color:var(--accent)}.r-warn{background:#fef3c7;color:#b45309}.r-good{background:#dcfce7;color:#15803d}
.flag{display:inline-block;font-size:10px;font-weight:900;color:#fff;background:var(--accent);border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:middle;letter-spacing:.03em}
.flag.warn{background:#f59e0b}
.loading{text-align:center;padding:50px 0;color:var(--muted);font-weight:700}
.matrix{overflow-x:auto}
.matrix table{min-width:640px}
.wkcell{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:13px;padding:6px 8px;border-radius:7px;display:inline-block;min-width:62px}
.wc-bad{background:#fde2e2;color:var(--accent)}.wc-warn{background:#fef3c7;color:#b45309}.wc-good{background:#dcfce7;color:#15803d}.wc-plain{color:var(--ink)}.fc-done{background:#dcfce7;color:#15803d;font-weight:900}.fc-undone{background:#fde2e2;color:var(--accent);font-weight:900}.clickable{cursor:pointer}.wkcell.clickable:hover{outline:2px solid var(--accent);outline-offset:1px}.wc-zero{color:#c9c2b6}
.wksub{font-size:10px;font-weight:700;opacity:.7}
.viewbar{display:flex;gap:8px;margin-top:16px}
.viewbar button{border:2px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:14px;padding:11px 22px;border-radius:12px;cursor:pointer;font-family:inherit}
.viewbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.frow{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin:6px 0;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .fd{font-family:"Anton";font-size:12px;color:var(--muted);min-width:44px}
.fchip{font-size:10px;font-weight:900;padding:2px 7px;border-radius:5px}
.fchip.why{background:#fde2e2;color:var(--accent)}
.fchip.who{background:#f0fdf4;color:#15803d}
.fchip.fmt{background:#eef2ff;color:#4338ca}
.fnote{font-weight:500;color:var(--ink)}
.pill{font-size:10px;font-weight:900;padding:2px 8px;border-radius:20px;margin-left:8px}
.pill.undone{background:#fde2e2;color:var(--accent)}
.pill.done{background:#dcfce7;color:#15803d}
.fcard{border:2px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px;background:var(--card)}
.fcard.undone{border-color:#f3b8b8;background:#fff8f8}
.fcard.done{border-color:#bbf7d0}
.fhead{display:flex;align-items:center;gap:10px}
.fname{font-family:"Anton";font-size:22px}
.falerts{margin:8px 0 4px;display:flex;gap:6px;flex-wrap:wrap}
.recbtn2{margin-top:10px;width:100%;padding:11px;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:10px;font-weight:900;font-family:inherit;font-size:14px;cursor:pointer}
.rankctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.rseg2{display:flex;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px}
.rseg2 button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit}
.rseg2 button.on{background:var(--ink);color:#fff}
.rankctrl select{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;font-family:inherit}
.rank-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rank-no{font-family:"Anton";font-size:24px;min-width:40px;text-align:center;color:var(--muted)}
.rank-no.top1{color:#d4af37}.rank-no.top2{color:#9ca3af}.rank-no.top3{color:#cd7f32}
.rank-nm{font-weight:900;font-size:16px;flex:1}
.rank-store{font-size:11px;color:var(--muted);font-weight:700;margin-left:6px}
.rank-val{font-family:"Anton";font-size:22px}
.rank-sub{font-size:11px;color:var(--muted);font-weight:700;min-width:70px;text-align:right}
.anwrap{display:flex;flex-direction:column;gap:14px}
.fbcard{background:#1f1e1c;color:#fff;border-radius:14px;padding:16px 18px}
.fbttl{font-family:"Anton";font-size:13px;letter-spacing:.08em;color:#cbb89a;margin-bottom:8px}
.fbbody{font-size:14px;line-height:1.7}
.fbbody b{color:#ffd9a0}
.ancard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.anh{font-family:"Anton";font-size:14px;letter-spacing:.03em;margin-bottom:10px}
.anrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.anlbl{min-width:44px;font-weight:900;font-size:13px}
.anlbl2{flex:1;font-weight:700;font-size:13px}
.anbar{flex:1;height:10px;background:#eee7db;border-radius:6px;overflow:hidden}
.anfill{height:100%;background:var(--accent)}
.anval{font-family:"Anton";font-size:13px;min-width:76px;text-align:right;color:var(--muted)}
.anstaff{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.anstaff:hover{background:#faf8f3}
.anstaff.good{background:#f0fdf4}.anstaff.bad{background:#fff5f5}
.ansname{flex:1;font-weight:900;font-size:15px}
.ansrate{font-family:"Anton";font-size:20px}
.anstaff.bad .ansrate{color:var(--accent)}.anstaff.good .ansrate{color:#15803d}
.ansn{font-size:12px;color:var(--muted);font-weight:700;min-width:44px;text-align:right}
.nmclick{cursor:pointer;border-bottom:2px dotted var(--muted)}
.nmclick:hover{color:var(--accent);border-color:var(--accent)}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:26px;font-weight:700;letter-spacing:.05em}

.recbtn{margin-top:12px;width:100%;padding:9px;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:9px;font-weight:900;font-family:inherit;font-size:13px;cursor:pointer}
.recbtn:hover{background:var(--accent);color:#fff}
.rseg{display:flex;gap:6px;flex-wrap:wrap}
.rseg button{flex:1;min-width:80px;padding:10px 6px;border:2px solid var(--line);background:#fff;border-radius:9px;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer}
.rseg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
<div class="wrap">

<div id="recModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px">

<script>
const API_URL="https://script.google.com/macros/s/AKfycbymLb-U79cBpBA8az64TzN3G6H0dLhLOpOiMmg229O_nXEKFsO2b896Pli7AU37r8NU/exec";
const RECORD_URL="https://script.google.com/macros/s/AKfycbwv1LAq68qfpYIy6GnOUZ8lY36FBJXvZVuWm0fy6rNlMv4DyxukYEEoYump94qnvV-tvg/exec"; // チェック記録の書き込み用GAS。空ならデモ動作
const GEO=["クレジット未所持","片道1時間以上の遠方","30分圏内に店舗なし","次回入会予定"];
const STAFF_MASTER={"神戸北": ["藤原あずさ", "片山享飛", "佐藤妃乃", "坂東羽菜", "藤田和斗", "善岡那菜", "戸田嵩大"], "三宮": ["坂口望", "牧村彪雅", "谷口誠弥", "塩見倖平", "藤澤直輝", "花岡龍哉", "宮本美来", "法利岳流", "久原隆志", "三俣篤史", "藤原李華", "迫水力", "熊給遥士", "須沢一茂"], "トアロード": ["森位宏平", "福島有斗", "金田稔生", "清藤剛", "白石智揮", "坂田拓未", "浅井諒治"], "元町": ["江藤勇斗", "樫根滉太郎", "太田垣敦知", "山田慶斗", "片寄洸佑", "森岡暖人"], "デュオ": ["宮脇虎之介", "小林麗次", "樽谷一輝", "西浦文崇", "長谷川舞", "陰山湧登", "西川凌牙", "政谷碧海"], "加古川": ["奥田圭太", "名倉知穂", "森田光心", "横田聖七", "山本翔人", "目叶隆人", "橋本ひとみ", "瀬戸口智絵"], "姫路": ["江崎翔悟", "松本賢人", "黒田大樹", "平郡楓雅", "田路佳久", "美根大基", "青木琴美", "藤原大将"], "イオン岡山": ["桑渕柊耶", "河上理佳子", "宮本樹", "小林鉄平", "仙田渉", "鶴田雄祐", "住吉麻生", "上田涼央", "石渕響"], "倉敷天満屋": ["宮原美咲", "林帆那", "梅野翔", "日笠希成", "有木智治", "近藤瞳"], "本通": ["田原佳輝", "河野拓実", "中嶋華那", "梅田そら", "川角龍悟", "伊達雄風", "千田一輝"], "ゆめタウン": ["原村侑希", "平良空翔", "谷平大礎", "藤江遼", "森川充晴", "清原綾乃"]};
// 回答の担当名を店舗マスターの最適なフルネームに寄せる
function normName(raw, store){
  if(!raw) return raw;
  const clean=String(raw).replace(/[\s　・,]/g,"").trim();
  const pool=(store&&STAFF_MASTER[store])?STAFF_MASTER[store]:[].concat(...Object.values(STAFF_MASTER));
  const pc=pool.map(n=>({full:n,c:n.replace(/\s/g,"")}));
  let hit=pc.find(x=>x.c===clean); if(hit)return hit.full;
  let fwd=pc.filter(x=>x.c.startsWith(clean)||clean.startsWith(x.c));
  if(fwd.length===1)return fwd[0].full;
  if(fwd.length>1&&store)return raw;
  const ac=[].concat(...Object.values(STAFF_MASTER)).map(n=>({full:n,c:n.replace(/\s/g,"")}));
  let g=ac.find(x=>x.c===clean); if(g)return g.full;
  let gf=ac.filter(x=>x.c.startsWith(clean)||clean.startsWith(x.c));
  if(gf.length===1)return gf[0].full;
  return raw;
}

const $=id=>document.getElementById(id);
let RAW=[],RECS=[],MONTH="",VIEW="perf";
let RK="rate",RS="area",RP="month",RWEEK=1;
const WEEK_LABEL={1:"1-7日",2:"8-14日",3:"15-21日",4:"22-28日",5:"29-末日"};
$("today").textContent="更新 "+new Date().toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
function sampleRows(){
  const staff=["千田","伊達","中嶋","田原","川角"];
  const stores={"兵庫":["三宮","元町","加古川"],"中国":["本通","イオン岡山"]};
  const reasons=["高い・予算が","今じゃなくていい","効果が続くか不安","都度でいい","必要性を感じてない"];
  let rows=[];const areas=Object.keys(stores);
  for(let day=1;day<=28;day++){const cnt=2+Math.floor(Math.random()*4);
    for(let k=0;k<cnt;k++){const ar=areas[Math.floor(Math.random()*areas.length)];
      const st=stores[ar][Math.floor(Math.random()*stores[ar].length)];
      const sf=staff[Math.floor(Math.random()*staff.length)];
      const joined=Math.random()<0.32;
      let reason=""; if(!joined) reason=Math.random()<0.2?GEO[Math.floor(Math.random()*GEO.length)]:reasons[Math.floor(Math.random()*reasons.length)];
      const shushoList=["肩","首","腰","背","臀部","足"]; const shusho=shushoList[Math.floor(Math.random()*shushoList.length)];
      rows.push({recv:`2026-07-${String(day).padStart(2,'0')} 10:00`,date:`2026-07-${String(day).padStart(2,'0')}`,area:ar,store:st,staff:sf,shusho,result:joined?"入会":"非入会",reason});}}
  return rows;
}
function ymd(s){
  if(!s)return null;
  var str=String(s);
  var m=str.replace(/\//g,"-").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return{d:+m[3],key:m[1]+"-"+String(+m[2]).padStart(2,'0')};
  var MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  var e=str.match(/([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})/);
  if(e&&MON[e[1]])return{d:+e[2],key:e[3]+"-"+String(MON[e[1]]).padStart(2,'0')};
  var dt=new Date(str);
  if(!isNaN(dt.getTime()))return{d:dt.getDate(),key:dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,'0')};
  return null;
}
function weekOf(d){if(d<=7)return 1;if(d<=14)return 2;if(d<=21)return 3;if(d<=28)return 4;return 5;}
const isJoin=r=>r.result==="入会";
const isGeo=r=>GEO.some(g=>String(r.reason).indexOf(g)>=0);
function boot(rows){

function recDate(s){var m=String(s).replace(/\//g,"-").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+String(+m[2]).padStart(2,'0')+"-"+String(+m[3]).padStart(2,'0');var MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};var e=String(s).match(/([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})/);if(e&&MON[e[1]])return e[3]+"-"+String(MON[e[1]]).padStart(2,'0')+"-"+String(+e[2]).padStart(2,'0');return String(s);}
const AREA_STORES={"兵庫":["神戸北","三宮","トアロード","元町","デュオ","加古川","姫路"],"中国":["イオン岡山","倉敷天満屋","本通","ゆめタウン"]};
function refreshStores(){const ar=$("area").value;let stores;if(ar==="全"){stores=[].concat(AREA_STORES["兵庫"],AREA_STORES["中国"]);}else{stores=AREA_STORES[ar]||[];}$("store").innerHTML='<option value="全">全店舗</option>'+stores.map(s=>`<option>${s}</option>`).join("");}
function filtered(){const ar=$("area").value,st=$("store").value;return RAW.filter(r=>r._mkey===MONTH&&(ar==="全"||r.area===ar)&&(st==="全"||r.store===st));}
const BODY_PARTS=["肩","首","腰","背","臀部","足","膝","股関節","腕","頭"];
function parts_(shusho){
  const head=String(shusho||"").split(/[／\/]/)[0];
  let found=head.split(/[・,、]/).map(x=>x.trim()).filter(Boolean);
  let out=found.filter(x=>BODY_PARTS.includes(x));
  if(out.length===0) out=["その他"];
  return [...new Set(out)];
}

function renderAnalyze(){
  MONTH=$("month").value;
  const ar=$("area").value, st=$("store").value;
  let pool=RAW.filter(r=>r._mkey===MONTH);
  if(st!=="全") pool=pool.filter(r=>r.store===st);
  else if(ar!=="全") pool=pool.filter(r=>r.area===ar);
  const total=pool.length, joined=pool.filter(isJoin).length;
  const rate=total?Math.round(joined/total*100):0;
  const reasonCount={};
  pool.filter(r=>!isJoin(r)&&!isGeo(r)).forEach(r=>{
    String(r.reason||"").split(/[・,]/).forEach(x=>{x=x.trim();if(x&&!GEO.some(g=>x.indexOf(g)>=0))reasonCount[x]=(reasonCount[x]||0)+1;});
  });
  const topReasons=Object.entries(reasonCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const byShu={};
  pool.forEach(r=>{ parts_(r.shusho).forEach(key=>{(byShu[key]=byShu[key]||[]).push(r);}); });
  const shuStats=Object.entries(byShu).map(([k,rs])=>({k,n:rs.length,j:rs.filter(isJoin).length,r:rs.length?rs.filter(isJoin).length/rs.length:0})).filter(x=>x.n>=2).sort((a,b)=>b.r-a.r);
  const byStaff={};
  pool.forEach(r=>{(byStaff[r.staff]=byStaff[r.staff]||[]).push(r);});
  const staffStats=Object.entries(byStaff).map(([name,rs])=>({name,n:rs.length,j:rs.filter(isJoin).length,r:rs.length?rs.filter(isJoin).length/rs.length:0})).filter(x=>x.n>=2).sort((a,b)=>b.r-a.r);
  let fb=[];
  if(total>0){
    fb.push("今月の入会率は<b>"+rate+"%</b>（"+joined+"/"+total+"）。");
    if(topReasons.length) fb.push("最も多い断り理由は「<b>"+topReasons[0][0]+"</b>」（"+topReasons[0][1]+"件）。");
    if(shuStats.length>=2){ const best=shuStats[0],worst=shuStats[shuStats.length-1];
      fb.push("主訴別では<b>"+best.k+"</b>が高く（"+Math.round(best.r*100)+"%）、<b>"+worst.k+"</b>が低い（"+Math.round(worst.r*100)+"%）。");}
    const low=staffStats.filter(x=>x.n>=3&&x.r<0.2);
    if(low.length) fb.push("入会率が特に低い（3件以上・20%未満）：<b>"+low.map(x=>x.name).join("、")+"</b>。個別フォロー推奨。");
  } else { fb.push("この条件のデータがまだありません。"); }
  let h='<div class="anwrap">';
  h+='<div class="fbcard"><div class="fbttl">全体フィードバック</div><div class="fbbody">'+fb.join(" ")+'</div></div>';
  if(shuStats.length){
    h+='<div class="ancard"><div class="anh">主訴別 入会率</div>';
    shuStats.forEach(x=>{h+='<div class="anrow"><span class="anlbl">'+x.k+'</span><div class="anbar"><div class="anfill" style="width:'+Math.round(x.r*100)+'%"></div></div><span class="anval">'+Math.round(x.r*100)+'% ('+x.j+'/'+x.n+')</span></div>';});
    h+='</div>';
  }
  if(topReasons.length){
    h+='<div class="ancard"><div class="anh">断られた理由 TOP5（対象外除く）</div>';
    topReasons.forEach(function(e){h+='<div class="anrow"><span class="anlbl2">'+e[0]+'</span><span class="anval">'+e[1]+'件</span></div>';});
    h+='</div>';
  }
  h+='<div class="fbcard" style="background:#e9e4d8;color:var(--muted)"><div class="fbbody" style="font-size:12px">スタッフ個人の分析は、<b style="color:var(--ink)">「実績」でスタッフ名をクリック</b>すると開きます。</div></div>';
  h+='</div>';
  $("staffTable").innerHTML=h;
}
window.openStaffAnalysis=function(name){

  pool.filter(r=>!isJoin(r)&&!isGeo(r)).forEach(r=>{String(r.reason||"").split(/[・,]/).forEach(x=>{x=x.trim();if(x&&!GEO.some(g=>x.indexOf(g)>=0))rc[x]=(rc[x]||0)+1;});});

  }
  document.getElementById("histTarget").textContent=name+" の分析";

  document.getElementById("histModal").style.display="flex";
};

function renderRank(){
  MONTH=$("month").value;
  const ar=$("area").value, st=$("store").value;
  let pool=RAW.filter(r=>r._mkey===MONTH);
  if(RS==="store" && st!=="全"){ pool=pool.filter(r=>r.store===st); }
  else if(RS==="area" && ar!=="全"){ pool=pool.filter(r=>r.area===ar); }
  if(RP==="week"){ pool=pool.filter(r=>r._week===RWEEK); }
  const by={};
  pool.forEach(r=>{(by[r.staff]=by[r.staff]||[]).push(r);});
  let list=Object.entries(by).map(([name,arr])=>{
    const n=arr.length,w=arr.filter(isJoin).length;
    const store=(arr[0]||{}).store||"";
    return {name,store,n,w,r:n?w/n:0};
  });
  if(RP==="month"){ list=list.filter(x=>x.n>=5); }
  if(RK==="rate"){ list.sort((a,b)=>b.r-a.r || b.w-a.w); }
  else { list.sort((a,b)=>b.w-a.w || b.r-a.r); }
  const scope = RS==="area" ? (ar==="全"?"全エリア":ar) : (st==="全"?"店舗未選択":st);
  const period = RP==="week" ? WEEK_LABEL[RWEEK]+"日" : "月間";
  const basis = RK==="rate" ? "入会率" : "入会数";
  $("panelTitle").textContent = "ランキング｜"+scope+"・"+period+"・"+basis+"順";
  if(RS==="store" && st==="全"){ $("staffTable").innerHTML='<div style="text-align:center;padding:40px 0;color:var(--muted);font-weight:700">店舗内ランキングは、上で店舗を選んでください</div>';return; }
  if(list.length===0){ $("staffTable").innerHTML='<div style="text-align:center;padding:40px 0;color:var(--muted);font-weight:700">この条件のデータがありません'+(RP==="month"?"（月間は母数5件以上）":"")+'</div>';return; }
  let h='<div>';
  list.forEach((x,i)=>{
    const no=i+1;
    const noCls=no===1?"top1":no===2?"top2":no===3?"top3":"";
    const main = RK==="rate" ? Math.round(x.r*100)+"%" : x.w+"件";
    const sub  = RK==="rate" ? "入"+x.w+"/母"+x.n : "入会率"+Math.round(x.r*100)+"% (母"+x.n+")";
    const storeLabel = RS==="area" ? '<span class="rank-store">'+x.store+'</span>' : "";
    h+='<div class="rank-row"><span class="rank-no '+noCls+'">'+no+'</span><span class="rank-nm">'+x.name+storeLabel+'</span><span class="rank-val">'+main+'</span><span class="rank-sub">'+sub+'</span></div>';
  });
  h+='</div>';
  $("staffTable").innerHTML=h;
}

function render(){
  MONTH=$("month").value;
  if(VIEW==="rank"){renderRank();return;}
  if(VIEW==="analyze"){renderAnalyze();return;}
  const st=$("store").value;
  const monthRows=filtered();
  const byStaff={};monthRows.forEach(r=>{(byStaff[r.staff]=byStaff[r.staff]||[]).push(r);});
  let names;
  if(st!=="全" && STAFF_MASTER[st]){ names=[...STAFF_MASTER[st]]; Object.keys(byStaff).forEach(n=>{if(!names.includes(n))names.push(n);}); }
  else { names=Object.keys(byStaff); }
  const rows=names.map(name=>{
    const list=byStaff[name]||[];
    const weeks={};[1,2,3,4,5].forEach(wk=>{const wl=list.filter(r=>r._week===wk);const n=wl.length,w=wl.filter(isJoin).length;weeks[wk]={n,w,r:n?w/n:0};});
    const n=list.length,w=list.filter(isJoin).length;
    const seq=monthRows.filter(r=>r.staff===name&&!isGeo(r)).sort((a,b)=>(a._d-b._d)||(String(a.recv)<String(b.recv)?-1:1));
    let streak=0;for(let k=seq.length-1;k>=0;k--){if(!isJoin(seq[k]))streak++;else break;}
    return {name,weeks,total:{n,w,r:n?w/n:0},streak,miss:streak>=3};
  });
  if(rows.length===0){$("staffTable").innerHTML='<div class="loading">この月のデータがありません</div>';return;}
  function cell(c,name,wk){
    if(c.n===0)return '<span class="wkcell wc-zero">—</span>';
    const bad=(c.n>=5&&c.r<=0.30);
    if(bad){
      const lbl=(wk?WEEK_LABEL[wk]:"月合計")+" 入会率"+Math.round(c.r*100)+"%";
      return `<span class="wkcell wc-bad clickable" onclick="openRec('${name}','${lbl}')" title="クリックでチェック記録">${Math.round(c.r*100)}%<span class="wksub"> (${c.w}/${c.n})</span></span>`;
    }
    return `<span class="wkcell wc-plain">${Math.round(c.r*100)}%<span class="wksub"> (${c.w}/${c.n})</span></span>`;
  }
  rows.forEach(row=>{
    const alertList=[];
    [1,2,3,4,5].forEach(wk=>{const c=row.weeks[wk];if(c.n>=5&&c.r<=0.30)alertList.push(WEEK_LABEL[wk]+" 入会率"+Math.round(c.r*100)+"%");});
    if(row.miss)alertList.push(row.streak+"連続非入会");
    row.alertList=alertList;
    row.recs=RECS.filter(r=>r.kind==="スタッフ"&&r.target===row.name&&r._mkey===MONTH).sort((a,b)=>a._date<b._date?1:-1);
  });
  if(VIEW==="perf"){
    let h='<div class="matrix"><table><thead><tr><th>スタッフ</th>';
    [1,2,3,4,5].forEach(wk=>h+=`<th>${WEEK_LABEL[wk]}</th>`);
    h+='<th>月合計</th></tr></thead><tbody>';
    rows.forEach(row=>{
      const flag=row.miss?`<span class="flag clickable" onclick="openRec('${row.name}','${row.streak}連続非入会')" title="クリックでチェック記録">${row.streak}連続非入会</span>`:'';
      const zeroRow=row.total.n===0?' style="opacity:.45"':'';
      h+=`<tr${zeroRow}><td class="nm"><span class="nmclick" onclick="openStaffAnalysis('${row.name}')" title="クリックで分析">${row.name}</span>${flag}</td>`;
      [1,2,3,4,5].forEach(wk=>h+=`<td>${cell(row.weeks[wk],row.name,wk)}</td>`);
      h+=`<td>${cell(row.total,row.name,0)}</td></tr>`;
    });
    $("staffTable").innerHTML=h+'</tbody></table></div>';
  }else{
    function fcell(c,name,wk){
      const isAlert=(c.n>=5&&c.r<=0.30);
      if(!isAlert)return '<span class="wkcell wc-zero"></span>';
      const lbl=WEEK_LABEL[wk]+" 入会率"+Math.round(c.r*100)+"%";
      const recs=RECS.filter(r=>r.kind==="スタッフ"&&r.target===name&&r._mkey===MONTH);
      const done=recs.length>0;
      const cls=done?"fc-done":"fc-undone";
      const label=done?"対応済":"未対応";
      return `<span class="wkcell ${cls} clickable" onclick="openHist('${name}','${lbl}')" title="クリックで対応内容">${label}</span>`;
    }
    let h='<div class="matrix"><table><thead><tr><th>スタッフ</th>';
    [1,2,3,4,5].forEach(wk=>h+=`<th>${WEEK_LABEL[wk]}</th>`);
    h+='<th>月合計</th></tr></thead><tbody>';
    rows.forEach(row=>{
      let missTag='';
      if(row.miss){
        const recs=RECS.filter(r=>r.kind==="スタッフ"&&r.target===row.name&&r._mkey===MONTH);
        const done=recs.length>0;
        missTag=`<span class="flag clickable" style="background:${done?'#16a34a':'var(--accent)'}" onclick="openHist('${row.name}','${row.streak}連続非入会')">${row.streak}連続非入会・${done?'対応済':'未対応'}</span>`;
      }
      const zeroRow=row.total.n===0?' style="opacity:.45"':'';
      h+=`<tr${zeroRow}><td class="nm">${row.name}${missTag}</td>`;
      [1,2,3,4,5].forEach(wk=>h+=`<td>${fcell(row.weeks[wk],row.name,wk)}</td>`);
      h+=`<td><span class="wkcell wc-zero"></span></td></tr>`;
    });
    $("staffTable").innerHTML=h+'</tbody></table></div>';
  }
}

function loadRecs(cb){
  if(!RECORD_URL){cb();return;}
  fetch(RECORD_URL).then(r=>r.json()).then(j=>{
    RECS=(j.rows||[]).map(r=>({...r,_date:recDate(r.date||r.recv),_mkey:r.month||""}));
    // monthが空なら日付から補完
    RECS.forEach(r=>{if(!r._mkey&&r._date){r._mkey=r._date.slice(0,7);}});
    cb();
  }).catch(()=>cb());
}
if(API_URL){
  fetch(API_URL).then(r=>r.json()).then(j=>{const rows=j.rows||[];loadRecs(()=>boot(rows));})
  .catch(e=>{$("sampleNote").style.display="block";$("sampleNote").textContent="API取得に失敗。サンプル表示中: "+e;boot(sampleRows());});
}
else{$("sampleNote").style.display="block";$("sampleNote").textContent="サンプルデータで表示中。実データに繋ぐと自動で切り替わります。";boot(sampleRows());}
</script>
